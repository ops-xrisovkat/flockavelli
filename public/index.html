<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flockavelli</title>
<meta name="description" content="flockavelli.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0c0d10; --surface-2:#1b1e25; --fg:#f3f0e9; --muted:#9a9da6;
    --line:#282b33; --accent:#ff3b33; --accent-ink:#fff; --maxw:1120px;
    --display:"Anton","Arial Narrow",system-ui,sans-serif;
    --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#f3f1ea; --fg:#17150f; --muted:#67665d; --line:#d8d3c7; --accent:#d61f1f; color-scheme:light;}}
  :root[data-theme="light"]{
    --bg:#f3f1ea; --fg:#17150f; --muted:#67665d; --line:#d8d3c7; --accent:#d61f1f; color-scheme:light;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;
    min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:16px}
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar-in{display:flex;align-items:center;gap:14px;min-height:58px;padding-block:9px}
  .brand{font-family:var(--display);font-size:24px;letter-spacing:.06em;line-height:1;text-transform:uppercase}
  .brand b{color:var(--accent);font-weight:inherit}
  .bar-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:2px}
  @media (max-width:640px){.bar-tag{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="wrap bar-in">
  <div class="brand">Flock<b>avelli</b></div>
  <div class="bar-tag">flockavelli.com</div>
</div></div>
</body>
</html>
